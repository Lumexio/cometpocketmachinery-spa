name: Bug report
description: Report a reproducible problem with the marketing SPA.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the Comet Pocket Machinery site.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route or URL
      placeholder: /innovations
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on Android
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
      description: Remove credentials, tokens, and personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed sensitive information from this report.
          required: true
